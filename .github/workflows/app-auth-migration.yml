name: Apply legacy auth hardening

on:
  push:
    branches: [repo-hardening]
    paths:
      - .github/workflows/app-auth-migration.yml

permissions:
  contents: write

jobs:
  migrate-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: repo-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply assertion-based migration
        run: python scripts/migrations/harden_app_auth.py

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Run repository and behavior guards
        run: |
          python scripts/check_repo_hygiene.py
          python -m unittest discover -s tests -v

      - name: Check patch formatting
        run: git diff --check

      - name: Commit migrated app.py
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "security: migrate legacy authentication safely"
          git push origin HEAD:repo-hardening
