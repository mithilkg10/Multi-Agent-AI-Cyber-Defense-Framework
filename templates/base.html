<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ABHEDYA — Cyber Intelligence{% endblock %}</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #03060a;
      --panel: rgba(10, 15, 24, 0.7);
      --panel-border: rgba(255, 115, 0, 0.15);
      --accent: #ff7300;
      --accent-glow: rgba(255, 115, 0, 0.45);
      --accent-2: #ffae42;
      --accent-2-glow: rgba(255, 174, 66, 0.35);
      --muted: #8b9bb0;
      --foreground: #f0f4f9;
      --glass-bg: rgba(10, 15, 24, 0.75);
      --glass-blur: blur(12px);
      --success: #00e676;
      --danger: #ff1744;
      --warning: #ffb300;
    }

    /* Reset & Custom Scrollbar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 115, 0, 0.3) rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 115, 0, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--foreground);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Background Network Canvas */
    canvas.bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.85;
    }

    /* Page container setup */
    #page-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* ===== PREMIUM HEADER ===== */
    .header {
      width: 100%;
      max-width: 1300px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 16px 24px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      color: #03060a;
      font-size: 1.4rem;
      font-weight: 800;
      box-shadow: 0 0 20px var(--accent-glow);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand .text-group {
      display: flex;
      flex-direction: column;
    }

    .brand .title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .brand .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Content Area styling */
    .table-card {
      width: 100%;
      max-width: 1300px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      z-index: 3;
      transition: border-color 0.3s ease;
    }
    
    .table-card:hover {
      border-color: rgba(255, 115, 0, 0.25);
    }

    .table-scroll {
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      overflow-x: auto;
      padding-right: 4px;
    }

    /* Custom Tables Design */
    table.display {
      width: 100% !important;
      border-collapse: collapse;
      font-family: inherit;
    }

    table.display thead th {
      position: sticky;
      top: 0;
      background: #090f19;
      color: var(--accent-2);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 16px;
      border-bottom: 2px solid var(--panel-border);
      text-align: left;
      z-index: 10;
    }

    table.display tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    table.display tbody tr {
      background: transparent;
    }

    table.display tbody tr:hover td {
      background: rgba(255, 115, 0, 0.05);
      color: #ffffff;
    }

    /* Buttons styling */
    .btn-action {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #03060a;
      font-weight: 700;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 22px rgba(255, 115, 0, 0.6);
      filter: brightness(1.1);
    }

    .btn-action:active {
      transform: translateY(0.5px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 115, 0, 0.25);
      color: var(--accent-2);
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 115, 0, 0.1);
      border-color: var(--accent-2);
      box-shadow: 0 0 12px rgba(255, 174, 66, 0.2);
    }

    /* Right Slide Drawer */
    #intel-drawer {
      position: fixed;
      right: 20px;
      top: 100px;
      width: 450px;
      height: calc(100vh - 140px);
      background: rgba(8, 12, 20, 0.98);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transform: translateX(120%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10050;
      padding: 24px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
    }

    #intel-drawer.open {
      transform: translateX(0);
      border-color: rgba(255, 115, 0, 0.35);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 115, 0, 0.15);
      padding-bottom: 12px;
    }

    .drawer-header h3 {
      color: var(--accent-2);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .drawer-close {
      background: rgba(255, 115, 0, 0.1);
      border: 1px solid rgba(255, 115, 0, 0.2);
      color: var(--accent-2);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .drawer-close:hover {
      background: var(--accent);
      color: #03060a;
      border-color: var(--accent);
    }

    #drawer-body {
      flex: 1;
      overflow-y: auto;
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.6;
    }

    @media (max-width: 1000px) {
      .table-card { max-width: 100%; }
      #intel-drawer { width: 90%; right: 5%; }
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body>
  <canvas id="honeycomb" class="bg"></canvas>

  <div id="page-wrapper">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="logo">A</div>
        <div class="text-group">
          <div class="title">ABHEDYA — Cyber Defense</div>
          <div class="subtitle">Operations Intelligence Panel</div>
        </div>
      </div>
      
      <!-- Placeholder block for custom header buttons inside templates -->
      <div class="header-actions">
        {% block header_actions %}{% endblock %}
      </div>
    </div>

    <!-- MAIN CARD -->
    <div class="table-card">
      <div class="table-scroll">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- SIDE DRAWER -->
  <div id="intel-drawer" aria-hidden="true">
    <div class="drawer-header">
      <h3 id="drawer-title">Metadata Details</h3>
      <button class="drawer-close" onclick="closeIntelDrawer()">Close</button>
    </div>
    <div id="drawer-body"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  {% block scripts %}
  <script>
    /* Honeycomb particle grid canvas background (Optimized) */
    const canvas = document.getElementById("honeycomb");
    const ctx = canvas.getContext("2d");
    function fit() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    fit();
    window.addEventListener('resize', fit);

    const hex = 16;
    const h = Math.sqrt(3) * hex;
    const w = hex * 1.8;
    
    // Dynamic movement points
    let pts = Array.from({length: 12}, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      p: Math.random() * Math.PI * 2,
      s: 0.005 + Math.random() * 0.01
    }));

    function drawHex(x, y, glow) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i;
        const px = x + hex * Math.cos(a);
        const py = y + hex * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(255, 115, 0, ${0.05 + glow * 0.25})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function anim() {
      ctx.fillStyle = '#03060a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid
      for (let y = 0; y < canvas.height + h; y += h * 1.08) {
        for (let x = 0; x < canvas.width + w; x += w * 1.08) {
          let gx = x + ((Math.floor(y / h) % 2) ? hex * 0.75 : 0);
          let glow = 0;
          pts.forEach(p => {
            const dx = gx - p.x;
            const dy = y - p.y;
            const d = dx * dx + dy * dy;
            if (d < 16000) {
              glow += (1 - Math.sqrt(d) / 126) * 0.85;
            }
          });
          drawHex(gx, y, Math.min(glow, 1.2));
        }
      }

      // Update points
      pts.forEach(p => {
        p.p += p.s;
        p.x += Math.sin(p.p) * 0.45;
        p.y += Math.cos(p.p) * 0.45;
        if (p.x < 0) p.x = canvas.width;
        if (p.y < 0) p.y = canvas.height;
        if (p.x > canvas.width) p.x = 0;
        if (p.y > canvas.height) p.y = 0;
      });
      
      requestAnimationFrame(anim);
    }
    anim();

    // Drawer helpers
    function openIntelDrawer(title, html) {
      document.getElementById('drawer-title').textContent = title || 'Details';
      document.getElementById('drawer-body').innerHTML = html || '';
      document.getElementById('intel-drawer').classList.add('open');
      document.getElementById('intel-drawer').setAttribute('aria-hidden', 'false');
    }

    function closeIntelDrawer() {
      document.getElementById('intel-drawer').classList.remove('open');
      document.getElementById('intel-drawer').setAttribute('aria-hidden', 'true');
    }
    
    // Bind global helpers
    window.openIntelDrawer = openIntelDrawer;
    window.closeIntelDrawer = closeIntelDrawer;
  </script>
  {% endblock %}
</body>
</html>
